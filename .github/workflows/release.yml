name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: docs-site
      - name: Build
        run: npm run build
        working-directory: docs-site

  release:
    needs: [test, docs]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(github.event.head_commit.message || '', '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists; a hand-made tag is colliding with the run number"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/set_version.py --version "$VERSION"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes "Automated release from ${GITHUB_SHA:0:7} on main."

  # Publishes the documentation app and the package index together. Runs on
  # every push to main, including one that skipped the release, so the site
  # never lags behind the branch.
  pages:
    needs: [test, docs, release]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.result == 'success' &&
      needs.docs.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    uses: ./.github/workflows/pages.yml
