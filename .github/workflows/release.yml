name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  release:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(github.event.head_commit.message || '', '[skip release]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = 'version = "0.1.0"'
          new = f'version = "{os.environ["VERSION"]}"'
          if old not in text:
              raise SystemExit("could not find version = \"0.1.0\" in pyproject.toml")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
        env:
          VERSION: 0.1.${{ github.run_number }}

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes "Automated release from ${GITHUB_SHA:0:7} on main."

      - name: Collect every release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p all-dist
          mapfile -t tags < <(gh release list --limit 200 --json tagName --jq '.[].tagName')
          for tag in "${tags[@]}"; do
            gh release download "$tag" --dir all-dist --pattern '*.whl' --pattern '*.tar.gz'
          done

      - name: Write GitHub Pages index
        run: |
          python scripts/write_simple_index.py \
            --dist all-dist \
            --site site \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --pages-url "https://dixonsolutions.github.io/${{ github.event.repository.name }}" \
            --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
