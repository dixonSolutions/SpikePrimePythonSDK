[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpikePrimePythonSDK"
version = "0.1.0"
description = "Unofficial Python SDK for SPIKE Prime HubOS 3 over Bluetooth Low Energy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SpikePrimePythonSDK contributors" }]
keywords = ["spike", "prime", "hubos", "robotics", "ble", "micropython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "bleak>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
spikeprime = "spikeprime.cli:main"

[project.urls]
Homepage = "https://github.com/dixonSolutions/SpikePrimePythonSDK"
Documentation = "https://dixonsolutions.github.io/SpikePrimePythonSDK/"
Issues = "https://github.com/dixonSolutions/SpikePrimePythonSDK/issues"
Protocol = "https://lego.github.io/spike-prime-docs/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spikeprime = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
