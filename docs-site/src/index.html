<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpikePrimePythonSDK — Python SDK for SPIKE Prime HubOS 3</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Unofficial Python SDK for SPIKE Prime HubOS 3 over Bluetooth Low Energy: connect, upload MicroPython, stream the hub console and read typed sensor snapshots."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so a dark-mode reader never
      // sees a flash of the light palette.
      (function () {
        try {
          var stored = localStorage.getItem('spikeprime-docs-theme');
          var dark =
            stored === 'dark' ||
            (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('sp-dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (error) {
          /* storage blocked; the app applies the theme after bootstrap */
        }
      })();
    </script>
  </head>
  <body>
    <sp-root></sp-root>
  </body>
</html>
